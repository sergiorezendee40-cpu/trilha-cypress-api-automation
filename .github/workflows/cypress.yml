name: Minha primeira execução co Actions
#controls when the workflow will run
on: 
#Triggers the workflow on push or pull requests event but only for the "main" br
  push:
   branches: ["main"]
   pull_request:
     branches: ["main"]
     
jobs:  
     cypress-run:
     runs-on: ubuntu-latest
     container: 
      image: cypress/browsers:18.12.0
      options: --user 1001
      steps:
            - name: Checkout
             uses: actions/checkout@v7
      # Install npm dependencies, cache them correctly
      # and run all Cypress tests
            - name: Cypress run
             uses: cypress-io/github-action@v7
      with:
          build: npm run build
          start: npm start
        env:
          # For recording and parallelization you must set your CYPRESS_RECORD_KEY
          # in GitHub repo → Settings → Secrets → Actions
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Create a token https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
